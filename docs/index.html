<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查询已在 OpenHarmony/HarmonyOS 上验证支持的 Go 三方库及其获取方式。">
  <title>OpenHarmony Go 包支持列表</title>
  <style>
    /* ============================================================
       设计系统
       ============================================================ */
    :root {
      /* 主色：Go 品牌蓝 #00acd7 */
      --c-primary: #00acd7;
      --c-primary-hover: #0098bd;
      --c-primary-deep: #007ab0;
      --c-primary-light: #e5f7fc;
      --c-accent: #f2a33c;

      /* 语义色 */
      --c-repo: #0d9668;
      --c-repo-bg: #ecfdf5;
      --c-repo-border: #a7f3d0;
      --c-official: #b45309;
      --c-official-bg: #fffbeb;
      --c-official-border: #fde68a;

      /* 中性色阶 */
      --c-bg: #f8fafb;
      --c-bg-grid: #eef2f4;
      --c-surface: #ffffff;
      --c-text: #182234;
      --c-text-2: #4a5468;
      --c-muted: #7b879c;
      --c-line: #e4e9ee;
      --c-line-soft: #f0f3f6;

      /* 尺寸 */
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;

      /* 阴影 */
      --shadow-xs: 0 1px 2px rgba(16, 30, 51, .04);
      --shadow-sm: 0 1px 3px rgba(16, 30, 51, .06), 0 1px 2px rgba(16, 30, 51, .04);
      --shadow-md: 0 4px 12px rgba(16, 30, 51, .08), 0 1px 3px rgba(16, 30, 51, .05);
      --shadow-lg: 0 12px 32px rgba(16, 30, 51, .12), 0 2px 8px rgba(16, 30, 51, .06);

      /* 字体 */
      --mono: "JetBrains Mono", "SF Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    /* ============================================================
       基础重置
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; min-width: 320px;
      background: var(--c-bg); color: var(--c-text);
      font-family: var(--sans); font-size: 14px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    a { color: var(--c-primary); text-decoration: none; }

    /* ============================================================
       Hero 顶栏（浅色系 + Go 品牌蓝点缀）
       ============================================================ */
    .hero {
      position: relative;
      background:
        radial-gradient(ellipse 90% 80% at 90% -20%, rgba(0, 172, 215, .14), transparent 55%),
        radial-gradient(ellipse 50% 60% at 5% 120%, rgba(0, 172, 215, .08), transparent),
        #fbfdfe;
      color: var(--c-text);
      overflow: hidden;
      border-bottom: 1px solid var(--c-line);
    }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0, 172, 215, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 172, 215, .06) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 85%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.55), transparent 85%);
    }
    .hero-inner {
      position: relative; z-index: 1;
      max-width: 1180px; margin: 0 auto; padding: 36px 20px 30px;
    }
    .hero-top {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      margin-bottom: 26px;
    }
    .brand { display: flex; align-items: center; gap: 18px; }
    .brand-logo {
      height: 44px; width: auto; display: block; flex-shrink: 0;
      filter: drop-shadow(0 2px 8px rgba(0, 172, 215, .35));
    }
    .brand-divider {
      width: 1px; height: 40px; flex-shrink: 0;
      background: linear-gradient(rgba(0, 172, 215, 0), rgba(0, 172, 215, .35), rgba(0, 172, 215, 0));
    }
    .brand h1 { margin: 0; font-size: 21px; font-weight: 750; letter-spacing: .3px; }
    .brand h1 em {
      font-style: normal;
      background: linear-gradient(90deg, #00acd7, #007ab0);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand p { margin: 3px 0 0; font-size: 13px; color: var(--c-muted); }

    /* Hero 统计卡片：横排嵌入顶栏 */
    .hero-stats {
      display: flex; gap: 0;
      background: #fff; border: 1px solid var(--c-line);
      border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .hero-stat {
      flex: 1; padding: 16px 22px; border-right: 1px solid var(--c-line-soft);
      transition: background .2s;
    }
    .hero-stat:last-child { border-right: 0; }
    .hero-stat:hover { background: #f5fbfd; }
    .hero-stat-label { display: block; font-size: 12px; color: var(--c-muted); margin-bottom: 2px; }
    .hero-stat-value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .hero-stat-value small { font-size: 13px; font-weight: 500; opacity: .6; margin-left: 3px; }
    .hero-stat.repo .hero-stat-value { color: var(--c-repo); }
    .hero-stat.official .hero-stat-value { color: var(--c-primary-deep); }

    /* GOPROXY 提示条：嵌入 hero 底部 */
    .hero-goproxy {
      margin-top: 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; border-radius: var(--radius);
      background: #f2fafd; border: 1px solid rgba(0, 172, 215, .22);
    }
    .hero-goproxy .tip { font-size: 13px; color: var(--c-text-2); }
    .hero-goproxy code {
      flex: 1; min-width: 240px; padding: 7px 13px; border-radius: var(--radius-xs);
      background: #fff; border: 1px solid var(--c-line);
      font-family: var(--mono); font-size: 12.5px; color: #065f75;
      overflow-x: auto; white-space: nowrap;
    }
    .copy-btn {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--c-primary); border-radius: var(--radius-xs);
      background: var(--c-primary); color: #fff;
      padding: 7px 16px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap;
      transition: all .2s ease;
    }
    .copy-btn:hover { background: var(--c-primary-hover); border-color: var(--c-primary-hover); }
    .copy-btn:active { transform: scale(.96); }
    .copy-btn.copied { background: var(--c-repo); border-color: var(--c-repo); }

    /* ============================================================
       主内容区
       ============================================================ */
    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }

    /* Sticky 工具栏 */
    .toolbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 14px 16px; margin: -8px -20px 16px;
      background: rgba(248, 250, 251, .92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--c-line);
    }
    .search-wrap { position: relative; flex: 1 1 380px; }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--c-muted); font-size: 16px; pointer-events: none;
      transition: color .2s;
    }
    #searchInput {
      width: 100%; height: 44px; padding: 0 14px 0 42px;
      border: 1.5px solid var(--c-line); border-radius: var(--radius-sm);
      background: var(--c-surface); color: var(--c-text); outline: none;
      box-shadow: var(--shadow-xs); transition: all .2s ease;
    }
    #searchInput:focus {
      border-color: var(--c-primary);
      box-shadow: 0 0 0 3px rgba(0, 172, 215, .15), var(--shadow-sm);
    }
    #searchInput:focus + .search-icon { color: var(--c-primary); }
    #searchInput::placeholder { color: #97a3b4; }

    .segments {
      display: inline-flex; height: 44px; padding: 4px; gap: 2px;
      border: 1.5px solid var(--c-line); border-radius: var(--radius-sm);
      background: var(--c-surface); box-shadow: var(--shadow-xs);
    }
    .segments button {
      padding: 0 18px; border: 0; border-radius: var(--radius-xs);
      background: transparent; color: var(--c-text-2); cursor: pointer;
      font-size: 13px; white-space: nowrap; font-weight: 500;
      transition: all .2s ease;
    }
    .segments button:hover { background: var(--c-line-soft); color: var(--c-text); }
    .segments button.active {
      background: var(--c-primary); color: #fff; font-weight: 600;
      box-shadow: 0 1px 3px rgba(0, 172, 215, .35);
    }

    /* 结果信息 */
    .result-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 10px; padding: 0 4px;
    }
    .result-info { color: var(--c-muted); font-size: 13px; }
    .result-info b { color: var(--c-text); font-weight: 650; }

    /* ============================================================
       表格
       ============================================================ */
    .table-wrap {
      border: 1px solid var(--c-line); border-radius: var(--radius);
      background: var(--c-surface); box-shadow: var(--shadow-sm); overflow: hidden;
    }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 580px; }
    thead th {
      padding: 10px 18px; background: var(--c-line-soft);
      color: var(--c-text-2); text-align: left; font-size: 12px;
      font-weight: 650; letter-spacing: .4px; text-transform: uppercase;
      border-bottom: 1px solid var(--c-line);
      position: sticky; top: 0;
    }
    tbody td {
      padding: 11px 18px; border-top: 1px solid var(--c-line-soft);
      font-size: 13.5px; vertical-align: middle;
    }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: #f0fafd; }
    .col-name { width: 20%; } .col-version { width: 22%; }
    .col-module { width: 38%; } .col-source { width: 20%; }

    .pkg-name { font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--c-text); }
    .pkg-version { font-family: var(--mono); font-size: 12.5px; color: var(--c-text-2); }
    .pkg-module { font-family: var(--mono); font-size: 12.5px; color: var(--c-primary); }
    .pkg-module:hover { text-decoration: underline; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid transparent; white-space: nowrap;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge-repo { background: var(--c-repo-bg); color: var(--c-repo); border-color: var(--c-repo-border); }
    .badge-official { background: var(--c-official-bg); color: var(--c-official); border-color: var(--c-official-border); }

    /* 搜索高亮：Go 蓝荧光笔下划效果 */
    mark { background: linear-gradient(transparent 50%, rgba(0, 172, 215, .25) 50%); color: inherit; padding: 0 1px; border-radius: 2px; }

    /* 空状态 */
    .empty {
      display: none; padding: 64px 24px; text-align: center;
    }
    .empty.visible { display: block; }
    .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .3; }
    .empty strong { display: block; margin-bottom: 6px; font-size: 15px; color: var(--c-text); }
    .empty span { color: var(--c-muted); font-size: 13px; }

    /* 加载骨架 */
    .skeleton-row { height: 49px; border-top: 1px solid var(--c-line-soft); }
    .skeleton-bar {
      height: 14px; margin: 18px; border-radius: 4px;
      background: linear-gradient(90deg, #eef2f4 25%, #e4e9ee 37%, #eef2f4 63%);
      background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
    }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

    /* 错误提示 */
    .error {
      margin-top: 16px; padding: 12px 16px;
      border-left: 3px solid #e5484d; border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
      background: #fef2f2; color: #e5484d; font-size: 13px;
    }

    /* ============================================================
       页脚
       ============================================================ */
    footer {
      max-width: 1180px; margin: 0 auto; padding: 0 20px 32px;
      color: var(--c-muted); font-size: 12.5px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    footer a { color: var(--c-primary); }
    footer a:hover { text-decoration: underline; }

    /* ============================================================
       响应式
       ============================================================ */
    @media (max-width: 768px) {
      .hero-inner { padding: 28px 16px 24px; }
      .hero-top { margin-bottom: 20px; }
      .brand-logo { height: 36px; }
      .brand h1 { font-size: 18px; }
      .brand p { font-size: 12px; }
      .hero-stats { flex-direction: column; border-radius: var(--radius-sm); }
      .hero-stat { border-right: 0; border-bottom: 1px solid var(--c-line-soft); padding: 12px 16px; }
      .hero-stat:last-child { border-bottom: 0; }
      .hero-stat-value { font-size: 24px; }
      .hero-goproxy { padding: 10px 12px; }
      .hero-goproxy .tip { font-size: 12px; }
      main { padding: 16px 16px 40px; }
      .toolbar { margin: -8px -16px 12px; padding: 12px 16px; }
      .search-wrap { flex-basis: 100%; }
      .segments { width: 100%; }
      .segments button { flex: 1; padding: 0 8px; }
      .col-module, td.module { display: none; }
      .col-name { width: 34%; } .col-version { width: 38%; } .col-source { width: 28%; }
      th, td { padding-left: 14px; padding-right: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!-- ============================== Hero ============================== -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <div class="brand">
          <img class="brand-logo" src="go-logo-blue.svg" alt="Go" width="117" height="44">
          <div class="brand-divider" aria-hidden="true"></div>
          <div>
            <h1>OpenHarmony <em>Go 包支持列表</em></h1>
            <p>查询已验证的 Go 三方库版本及获取方式</p>
          </div>
        </div>
      </div>

      <div class="hero-stats" aria-label="支持包统计">
        <div class="hero-stat">
          <span class="hero-stat-label">支持包总数</span>
          <span class="hero-stat-value" id="totalCount">—</span>
        </div>
        <div class="hero-stat repo">
          <span class="hero-stat-label">制品仓（需配置鸿蒙源 GOPROXY）</span>
          <span class="hero-stat-value" id="repoCount">—</span>
        </div>
        <div class="hero-stat official">
          <span class="hero-stat-label">官方源（直接可用）</span>
          <span class="hero-stat-value" id="officialCount">—</span>
        </div>
      </div>

      <div class="hero-goproxy">
        <span class="tip">配置鸿蒙源 GOPROXY:</span>
        <code id="goproxyCmd">go env -w GOPROXY=https://go.repo.openharmony.cn/artifactory/openharmony-go</code>
        <button class="copy-btn" id="copyProxy" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制
        </button>
      </div>
    </div>
  </header>

  <!-- ============================== 主体 ============================== -->
  <main>
    <div class="toolbar" id="toolbar">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="输入包名或 module 路径，如 sqlite3" autocomplete="off" spellcheck="false" aria-label="搜索 Go 包">
        <span class="search-icon" aria-hidden="true">⌕</span>
      </div>
      <div class="segments" id="sourceFilter" aria-label="按获取方式筛选">
        <button type="button" class="active" data-source="all">全部</button>
        <button type="button" data-source="repo">制品仓</button>
        <button type="button" data-source="official">官方源</button>
      </div>
    </div>

    <div class="result-bar">
      <div class="result-info" id="resultInfo" aria-live="polite">正在加载数据…</div>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table id="resultTable">
          <thead><tr>
            <th class="col-name">包名</th><th class="col-version">版本</th>
            <th class="col-module">仓库地址（module 路径）</th><th class="col-source">获取方式</th>
          </tr></thead>
          <tbody id="resultBody">
            <!-- 骨架屏：加载完替换 -->
            <tr><td><div class="skeleton-bar"></div></td><td><div class="skeleton-bar"></div></td><td><div class="skeleton-bar"></div></td><td><div class="skeleton-bar"></div></td></tr>
            <tr><td><div class="skeleton-bar"></div></td><td><div class="skeleton-bar"></div></td><td><div class="skeleton-bar"></div></td><td><div class="skeleton-bar"></div></td></tr>
            <tr><td><div class="skeleton-bar"></div></td><td><div class="skeleton-bar"></div></td><td><div class="skeleton-bar"></div></td><td><div class="skeleton-bar"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="empty" id="emptyState">
        <div class="empty-icon">🔍</div>
        <strong>未找到匹配的包</strong>
        <span>请调整关键词或获取方式后重试</span>
      </div>
    </div>
    <div id="errorMessage" role="alert"></div>
  </main>

  <!-- ============================== 页脚 ============================== -->
  <footer>
    <span>数据来自 <a href="https://gitcode.com/OpenHarmonyPCDeveloper/Goland_Package_For_HarmonyOS/blob/main/support_list.md">support_list.md</a>，最后更新：<span id="lastUpdated">—</span></span>
    <span>OpenHarmony Go 适配 · <a href="https://gitcode.com/OpenHarmonyPCDeveloper/Goland_Package_For_HarmonyOS">GitCode</a></span>
  </footer>

  <script>
    const DATA_URL = "data.json";
    const state = { packages: [], query: "", source: "all" };
    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      const node = document.createElement("span");
      node.textContent = String(value);
      return node.innerHTML;
    }

    function highlight(text, q) {
      if (!q) return escapeHtml(text);
      const lower = text.toLocaleLowerCase("en-US");
      const idx = lower.indexOf(q);
      if (idx < 0) return escapeHtml(text);
      return escapeHtml(text.slice(0, idx))
        + "<mark>" + escapeHtml(text.slice(idx, idx + q.length)) + "</mark>"
        + escapeHtml(text.slice(idx + q.length));
    }

    function moduleUrl(module) {
      if (module.startsWith("github.com/")) return "https://" + module;
      if (module.startsWith("golang.org/x/")) return "https://go.googlesource.com/" + module.slice("golang.org/".length);
      if (module.startsWith("google.golang.org/")) return "https://cs.opensource.google/go/" + module;
      return "https://pkg.go.dev/" + module;
    }

    function matchesSource(pkg) {
      return state.source === "all" || pkg.source === state.source;
    }

    function render() {
      const q = state.query.toLocaleLowerCase("en-US");
      const filtered = state.packages.filter(pkg => {
        if (!matchesSource(pkg)) return false;
        if (!q) return true;
        return pkg.name.toLocaleLowerCase("en-US").includes(q)
            || pkg.module.toLocaleLowerCase("en-US").includes(q);
      });

      $("resultBody").innerHTML = filtered.map(pkg => {
        const badge = pkg.source === "repo"
          ? '<span class="badge badge-repo">制品仓</span>'
          : '<span class="badge badge-official">官方源</span>';
        const module = `<a class="pkg-module" href="${escapeHtml(moduleUrl(pkg.module))}" target="_blank" rel="noopener">${highlight(pkg.module, q)}</a>`;
        return `<tr><td class="pkg-name">${highlight(pkg.name, q)}</td><td class="pkg-version">${escapeHtml(pkg.version)}</td><td>${module}</td><td>${badge}</td></tr>`;
      }).join("");

      const label = q ? `“${state.query}”的搜索结果` : "全部包";
      $("resultInfo").innerHTML = `${label} · <b>${filtered.length.toLocaleString("zh-CN")}</b> 个包`;
      $("resultTable").style.display = filtered.length ? "" : "none";
      $("emptyState").classList.toggle("visible", !filtered.length);
    }

    let searchTimer;
    $("searchInput").addEventListener("input", event => {
      state.query = event.target.value.trim();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(render, 120);
    });

    $("sourceFilter").addEventListener("click", event => {
      const button = event.target.closest("button[data-source]");
      if (!button) return;
      state.source = button.dataset.source;
      event.currentTarget.querySelectorAll("button").forEach(item => item.classList.toggle("active", item === button));
      render();
    });

    $("copyProxy").addEventListener("click", async () => {
      const btn = $("copyProxy");
      try {
        await navigator.clipboard.writeText($("goproxyCmd").textContent);
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已复制';
        btn.classList.add("copied");
        setTimeout(() => {
          btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 复制';
          btn.classList.remove("copied");
        }, 1500);
      } catch {
        const range = document.createRange();
        range.selectNodeContents($("goproxyCmd"));
        const sel = getSelection();
        sel.removeAllRanges(); sel.addRange(range);
        btn.textContent = "已选中，请 Ctrl+C";
      }
    });

    async function init() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error("无法读取数据");
        const data = await response.json();
        state.packages = data.packages;
        $("totalCount").textContent = data.total.toLocaleString("zh-CN");
        $("repoCount").textContent = data.repo.toLocaleString("zh-CN");
        $("officialCount").textContent = data.official.toLocaleString("zh-CN");
        $("lastUpdated").textContent = data.last_updated;
        render();
      } catch (error) {
        $("resultBody").innerHTML = "";
        $("resultInfo").textContent = "暂无数据";
        $("errorMessage").innerHTML = `<div class="error">初始化失败：${escapeHtml(error.message)}。请通过 HTTP 服务访问此页面。</div>`;
      }
    }
    init();
  </script>
</body>
</html>
